apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: telegram-bot

  template:
    metadata:
      labels:
        app: telegram-bot

    spec:
      containers:
        - name: telegram-bot
          image: 5um1t/sea-project:latest
          imagePullPolicy: Always

          envFrom:
            - secretRef:
                name: telegram-bot-secrets

          ports:
            - containerPort: 10000

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /
              port: 10000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 10000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
